<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأليف كتاب الحياة الفطرية - عراقي إيكو</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-docx-js/0.3.1/html_docx.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        @page {
            size: A4;
            margin: 20mm;
        }
        body {
            font-family: 'Amiri', 'Traditional Arabic', serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 { text-align: center; color: #1e3799; font-size: 26px; margin-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #34495e; }
        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background-color: #16a085;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { background-color: #138d75; }
        .loading { text-align: center; color: #d35400; font-weight: bold; display: none; margin: 15px 0; font-size: 15px; }
        
        /* تصميم صفحة الكتاب الاحترافية */
        .book-preview { margin-top: 50px; border-top: 3px solid #bdc3c7; padding-top: 30px; }
        .page {
            width: 21cm;
            min-height: 29.7cm;
            padding: 2.2cm 2.5cm;
            margin: 30px auto;
            background: #fffdf9; /* لون ورق الكتب العاجي الفاخر */
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            box-sizing: border-box;
            position: relative;
            page-break-after: always;
            border: 1px solid #e2dedb;
        }
        
        /* الشعار المطلوب: علامة صغيرة خضراء في أعلى الوسط */
        .header-badge-container {
            text-align: center;
            margin-bottom: 25px;
        }
        .eco-badge {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 4px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(39, 174, 96, 0.3);
            letter-spacing: 0.5px;
        }

        .animal-title { text-align: center; font-size: 28px; font-weight: bold; color: #2c3e50; margin: 0 0 5px 0; }
        .animal-latin { text-align: center; font-style: italic; font-size: 16px; color: #7f8c8d; margin-bottom: 25px; font-family: 'Times New Roman', serif; }
        
        /* مكان الصورة في منتصف الصفحة بحجم مثالي للكتاب */
        .image-container {
            text-align: center;
            margin: 25px 0;
        }
        .image-placeholder {
            width: 65%;
            height: 220px;
            margin: 0 auto;
            border: 2px dashed #95a5a6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            background-color: #fcfcfc;
            border-radius: 6px;
            font-size: 14px;
        }

        /* جدول بيانات بتنسيق ويكيبيديا أنيق وعصري */
        .wiki-table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 13px;
            background: #fff;
            border: 1px solid #dcdde1;
        }
        .wiki-table th, .wiki-table td {
            border: 1px solid #dcdde1;
            padding: 8px 12px;
            text-align: right;
        }
        .wiki-table th {
            background-color: #f1f2f6;
            color: #2f3640;
            width: 28%;
            font-weight: bold;
        }
        
        .description-box {
            line-height: 2;
            text-align: justify;
            font-size: 15px;
            color: #2f3640;
            margin-bottom: 25px;
        }
        .description-box strong {
            color: #1e3799;
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
            border-bottom: 1.5px solid #1e3799;
            padding-bottom: 3px;
        }

        .sources-section {
            margin-top: 30px;
            font-size: 12px;
            border-top: 1px dashed #b2bec3;
            padding-top: 10px;
            color: #57606f;
        }
        .page-number {
            position: absolute;
            bottom: 1.2cm;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: #718093;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>مُصنّف الكتب الآلي - عراقي إيكو</h1>
    <p style="text-align: center; color: #57606f; margin-bottom: 25px;">أدخل قائمة الأسماء (كل اسم في سطر)، وسيقوم النظام بالبحث الذكي وتنسيق صفحات الكتاب.</p>

    <div class="form-group">
        <label>قائمة أسماء الحيوانات:</label>
        <textarea id="namesList" placeholder="لقلق ابيض&#10;ذئب رمادي&#10;قط الجنگل&#10;الورل العراقي"></textarea>
    </div>

    <button onclick="processAnimalsList()">بدء تأليف وصنع الكتاب تلقائياً</button>
    <div id="loadingStatus" class="loading">جاري معالجة القائمة والبحث الذكي في قواعد البيانات...</div>
    <button onclick="downloadWord()" style="background-color: #2980b9; margin-top: 15px;">تحميل الكتاب كاملاً بصيغة Word (جاهز للطباعة)</button>

    <div class="book-preview">
        <h3 style="color: #2c3e50; text-align: center; margin-bottom: 20px;">معاينة صفحات الكتاب</h3>
        <div id="bookContainer">
            <p style="color: #a4b0be; text-align: center;">لم تقم بتوليد أي صفحات بعد.</p>
        </div>
    </div>
</div>

<script>
    let pagesContent = [];

    async function processAnimalsList() {
        const text = document.getElementById('namesList').value.trim();
        if (!text) {
            alert('يرجى إدخال اسم حيوان واحد على الأقل.');
            return;
        }

        const names = text.split('\n').map(name => name.trim()).filter(name => name.length > 0);
        const container = document.getElementById('bookContainer');
        const loader = document.getElementById('loadingStatus');
        
        loader.style.display = 'block';
        pagesContent = [];
        container.innerHTML = '';

        for (let i = 0; i < names.length; i++) {
            loader.innerText = `جاري البحث الذكي وتوليد صفحة (${i + 1} من ${names.length}): ${names[i]}...`;
            let animalData = await smartWikiFetch(names[i]);
            
            let pageHTML = `
                <div class="page">
                    <div class="header-badge-container">
                        <span class="eco-badge">عراقي إيكو</span>
                    </div>

                    <h2 class="animal-title">${animalData.title}</h2>
                    <div class="animal-latin">${animalData.latin}</div>
                    
                    <div class="image-container">
                        <div class="image-placeholder">[ مكان الصورة هنا ]</div>
                    </div>

                    <table class="wiki-table">
                        <tr><th>الاسم الشائع</th><td>${animalData.title}</td></tr>
                        <tr><th>الاسم العلمي</th><td><i>${animalData.latin}</i></td></tr>
                        <tr><th>التصنيف البيئي</th><td>الحياة الفطرية في العراق</td></tr>
                        <tr><th>المصدر الأساسي</th><td>موسوعة ويكيبيديا المفتوحة (عراقي إيكو)</td></tr>
                    </table>
                    
                    <div class="description-box">
                        <strong>نبذة وعلم البيئة:</strong>
                        ${animalData.extract}
                    </div>

                    <div class="sources-section">
                        <strong>المصادر والمراجع المعتمدة:</strong><br>
                        - أرشيف قاعدة بيانات ويكيبيديا الحرة.<br>
                        - مشروع توثيق التنوع الإحيائي العراقي - عراقي إيكو.
                    </div>

                    <div class="page-number">${i + 1}</div>
                </div>
            `;
            pagesContent.push(pageHTML);
        }

        loader.style.display = 'none';
        container.innerHTML = pagesContent.join('');
        alert('تم اكتمال تأليف الكتاب وتنسيق الصفحات بنجاح!');
    }

    // نظام البحث الذكي والمرن متجاوزاً أخطاء التشغيل والإملاء الدقيق
    async function smartWikiFetch(query) {
        try {
            // خطوة 1: استخدام OpenSearch للبحث المرن عن أقرب عنوان مطابق حتى لو بدون تشكيل
            let searchUrl = `https://ar.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=1&namespace=0&format=json&origin=*`;
            let searchRes = await fetch(searchUrl);
            let searchData = await searchRes.json();
            
            let bestTitle = query;
            if (searchData[1] && searchData[1].length > 0) {
                bestTitle = searchData[1][0]; // جلب أقرب اسم صحيح ومقترح من الموسوعة
            }

            // خطوة 2: جلب محتوى المقالة والاسم الإنجليزي/اللاتيني بناءً على العنوان الصحيح المُستنتج
            let contentUrl = `https://ar.wikipedia.org/w/api.php?action=query&prop=extracts|langlinks&exintro=true&explaintext=true&lllang=en&titles=${encodeURIComponent(bestTitle)}&format=json&origin=*`;
            let res = await fetch(contentUrl);
            let data = await res.json();
            let pages = data.query.pages;
            let pageId = Object.keys(pages)[0];

            if (pageId !== "-1") {
                let page = pages[pageId];
                let title = page.title;
                let extract = page.extract ? page.extract : 'يتوفر هذا الحيوان ضمن السجلات الطبيعية لبيئة العراق، ويمكن إضافة التفاصيل الميدانية يختصاص الباحث.';
                
                // استخراج الاسم باللاتينية من الوصلات اللغوية الإنجليزية إن وجدت
                let latinName = "Taxon / Species";
                if (page.langlinks && page.langlinks.length > 0) {
                    latinName = page.langlinks[0]['*'];
                }

                return { title: title, latin: latinName, extract: extract };
            } else {
                return { 
                    title: query, 
                    latin: 'Species indet', 
                    extract: 'تم رصد هذا الكائن ضمن البيئة المحلية، ولم يتم العثور على مقالة مفهرسة له بالنص الدقيق في الأرشيف المباشر، يکیب استعراضه يدوياً أو تزويده باسم مرادف.' 
                };
            }
        } catch (error) {
            return { title: query, latin: 'Species', extract: 'تعذر جلب البيانات بشكل مؤقت بسبب شبكة الاتصال.' };
        }
    }

    function downloadWord() {
        if (pagesContent.length === 0) {
            alert('الكتاب فارغ، قم بتوليد الصفحات أولاً.');
            return;
        }

        let fullDocumentHTML = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>كتاب الحياة الفطرية</title></head>
            <body style="direction: rtl; font-family: 'Amiri', serif;">
                ${pagesContent.join('<br style="page-break-before:always">')}
            </body>
            </html>
        `;

        let converted = htmlDocx.asBlob(fullDocumentHTML);
        saveAs(converted, 'Iraqi_Eco_Book_V2.docx');
    }
</script>

</body>
</html>
